name: Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - media/**
      - .github/scripts/build_docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        # mkdocs 2.0 drops the plugin system material relies on, so stay on 1.x.
        run: pip install --disable-pip-version-check "mkdocs-material~=9.7" "mkdocs<2"

      - name: Generate docs from README.md
        run: python .github/scripts/build_docs.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
